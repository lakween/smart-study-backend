name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smart-study-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build TypeScript
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure deployment SSH key
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload versioned release
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "deploy@$SERVER_HOST" \
            "mkdir -p /opt/smart-study-backend/releases/$RELEASE_SHA"
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='uploads/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='*.log' \
            ./ "deploy@$SERVER_HOST:/opt/smart-study-backend/releases/$RELEASE_SHA/"

      - name: Build, migrate, activate, and verify
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "deploy@$SERVER_HOST" \
            "RELEASE_SHA='$RELEASE_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          app_root=/opt/smart-study-backend
          release_dir="$app_root/releases/$RELEASE_SHA"
          previous_release=""

          if [ -L "$app_root/current" ]; then
            previous_release="$(readlink -f "$app_root/current")"
          fi

          test -f "$app_root/shared/.env" || {
            echo "Missing $app_root/shared/.env"
            exit 1
          }

          ln -sfn "$app_root/shared/.env" "$release_dir/.env"
          ln -sfn "$app_root/shared/uploads" "$release_dir/uploads"

          cd "$release_dir"
          npm ci
          npm run prisma:generate
          npx prisma migrate deploy
          npm run build

          ln -sfn "$release_dir" "$app_root/current.next"
          mv -Tf "$app_root/current.next" "$app_root/current"
          sudo systemctl restart smart-study-backend.service

          healthy=false
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" = true ]; then
            echo "Deployment $RELEASE_SHA is healthy"
            exit 0
          fi

          echo "Health check failed"
          if [ -n "$previous_release" ] && [ -d "$previous_release" ]; then
            echo "Rolling back to $previous_release"
            ln -sfn "$previous_release" "$app_root/current.next"
            mv -Tf "$app_root/current.next" "$app_root/current"
            sudo systemctl restart smart-study-backend.service
          fi
          sudo journalctl -u smart-study-backend.service -n 100 --no-pager
          exit 1
          REMOTE
